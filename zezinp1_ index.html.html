    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle, #202020, #080808 70%);
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .perfil {
            width: 100%;
            max-width: 480px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .foto {
            width: 145px;
            height: 145px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #444;
            box-shadow: 0 0 35px #ffffff18;
        }

        .nome {
            font-size: 38px;
            letter-spacing: 3px;
            margin: 22px 0 5px;
        }

        .apelido {
            color: #999;
            font-size: 13px;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }

        .pais {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            background: #191919;
            border: 1px solid #333;
            border-radius: 30px;
            padding: 10px 17px;
            color: #ddd;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .redes {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 35px;
        }

        .rede {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 18px;
            background: linear-gradient(120deg, #242424, #151515);
            border: 1px solid #383838;
            border-radius: 12px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .rede:hover {
            background: #333;
            transform: translateY(-3px);
            border-color: #777;
        }

        .visualizacoes {
            color: #777;
            font-size: 15px;
            letter-spacing: 1px;
            margin-top: 15px;
        }

        footer {
            color: #555;
            font-size: 10px;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        @media (max-width: 500px) {
            .nome {
                font-size: 31px;
            }

            .foto {
                width: 125px;
                height: 125px;
            }
        }
    </style>
